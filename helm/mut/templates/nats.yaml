{{- if not .Values.nats.url }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mut.fullname" . }}-nats
  labels:
    {{- include "mut.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mut.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        {{- include "mut.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-p", "4222"]
          ports:
            - name: client
              containerPort: 4222
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mut.fullname" . }}-nats
  labels:
    {{- include "mut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mut.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
{{- end }}
