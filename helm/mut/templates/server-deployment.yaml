apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mut.fullname" . }}-server
  labels:
    {{- include "mut.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.server }}
  selector:
    matchLabels:
      {{- include "mut.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "mut.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: {{ include "mut.image" . }}
          args: ["server", "-c", "/app/configs/config.dist.yml"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "mut.env" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/v1/public/_ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/public/_health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
