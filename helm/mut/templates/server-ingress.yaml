{{- if .Values.ingressHost }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mut.fullname" . }}-server
  labels:
    {{- include "mut.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.ingressHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mut.fullname" . }}-server
                port:
                  name: http
{{- end }}
