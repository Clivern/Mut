apiVersion: v1
kind: Service
metadata:
  name: {{ include "mut.fullname" . }}-server
  labels:
    {{- include "mut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mut.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
