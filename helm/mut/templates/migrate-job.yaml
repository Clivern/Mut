apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mut.fullname" . }}-migrate
  labels:
    {{- include "mut.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "mut.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "mut.image" . }}
          args: ["migrate", "up", "-c", "/app/configs/config.dist.yml"]
          env:
            {{- include "mut.env" . | nindent 12 }}
