{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mut.secretName" . }}
  labels:
    {{- include "mut.labels" . | nindent 4 }}
type: Opaque
stringData:
  MUT_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  MUT_SERVER_PROM_METRICS_SECRET: {{ .Values.secrets.metricsSecret | quote }}
  MUT_AI_API_KEY: {{ .Values.secrets.aiApiKey | quote }}
  MUT_RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  MUT_OAUTH_GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  MUT_OAUTH_GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- if not .Values.postgres.existingSecret }}
  MUT_DATABASE_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
{{- end }}
