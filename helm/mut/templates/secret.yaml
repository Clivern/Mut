{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mut.secretName" . }}
  labels:
    {{- include "mut.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if ne $key "existingSecret" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.database.existingSecret }}
  MUT_DATABASE_PASSWORD: {{ .Values.database.password | quote }}
  {{- end }}
{{- end }}
