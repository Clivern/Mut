apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mut.fullname" . }}-worker
  labels:
    {{- include "mut.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "mut.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "mut.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: {{ include "mut.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker", "-c", "/app/configs/config.dist.yml"]
          env:
            {{- include "mut.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
