# Container image. The tag defaults to the chart appVersion.
image: clivern/mut
tag: ""

# Public URL of Mut, used in links and OAuth callbacks.
publicUrl: https://mut.example.com
# Set to expose the server through an Ingress on this host.
ingressHost: ""

replicas:
  server: 1
  worker: 1

# External PostgreSQL. Required.
database:
  host: ""
  port: 5432
  name: mut
  user: postgres
  # Used only when existingSecret is empty. The secret must hold MUT_DATABASE_PASSWORD.
  password: ""
  existingSecret: ""

# NATS server. Empty deploys NATS in this release, otherwise use this URL.
nats:
  url: ""

# Secret values, keyed by env var name. Ignored when existingSecret is set,
# and that secret must hold the same keys.
secrets:
  existingSecret: ""
  MUT_ENCRYPTION_KEY: ""
  MUT_SERVER_PROM_METRICS_SECRET: secret
  MUT_AI_API_KEY: ""
  MUT_RESEND_API_KEY: ""
  MUT_OAUTH_GITHUB_CLIENT_SECRET: ""
  MUT_OAUTH_GOOGLE_CLIENT_SECRET: ""
