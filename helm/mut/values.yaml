# Container image. The tag defaults to the chart appVersion.
image: clivern/mut
tag: ""

# Public URL of Mut, used in links and OAuth callbacks.
publicUrl: https://mut.example.com
# Set to expose the server through an Ingress on this host.
ingressHost: ""

replicas:
  server: 1
  worker: 1

# External PostgreSQL. Required.
database:
  host: ""
  port: 5432
  name: mut
  user: postgres

# NATS server. Empty deploys NATS in this release, otherwise use this URL.
nats:
  url: ""

# OAuth client IDs. The client secrets go in secrets below.
oauth:
  MUT_OAUTH_GITHUB_CLIENT_ID: ""
  MUT_OAUTH_GOOGLE_CLIENT_ID: ""

# Secret values, keyed by env var name. The chart stores them in one Secret.
# Keep this file out of git, or pass values with --set-file.
secrets:
  MUT_DATABASE_PASSWORD: ""
  MUT_ENCRYPTION_KEY: ""
  MUT_SERVER_PROM_METRICS_SECRET: ""
  MUT_AI_API_KEY: ""
  MUT_RESEND_API_KEY: ""
  MUT_OAUTH_GITHUB_CLIENT_SECRET: ""
  MUT_OAUTH_GOOGLE_CLIENT_SECRET: ""
