# Image used by the server, worker and migration job.
image:
  repository: clivern/mut
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

server:
  replicas: 1
  # Public URL users reach Mut at, used in links and OAuth callbacks (MUT_SERVER_URL).
  publicUrl: https://mut.example.com
  port: 8000
  resources: {}
  ingress:
    enabled: false
    className: ""
    host: mut.example.com
    annotations: {}

worker:
  replicas: 1
  resources: {}

# External PostgreSQL. Required.
postgres:
  host: ""
  port: 5432
  database: mut
  username: postgres
  # Used only when existingSecret is empty. The chart then creates the secret.
  password: ""
  # Existing secret holding the database password under existingSecretKey.
  existingSecret: ""
  existingSecretKey: MUT_DATABASE_PASSWORD

# NATS message bus used by the server and the worker.
nats:
  # Deploy a NATS server in this release. When false, set url.
  enabled: true
  url: ""
  image: nats:2.10-alpine
  queue: mut

# Secret values. Leave existingSecret empty to let the chart create the secret.
# An existing secret must contain every key listed in templates/secret.yaml.
secrets:
  existingSecret: ""
  encryptionKey: ""
  metricsSecret: secret
  aiApiKey: ""
  resendApiKey: ""
  githubClientSecret: ""
  googleClientSecret: ""

# Extra non-secret MUT_* environment variables.
config:
  MUT_SERVER_MODE: prod
  MUT_SERVER_LOG_LEVEL: info
  MUT_SERVER_LOG_FORMAT: json
