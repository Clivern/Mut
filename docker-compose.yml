name: mut

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mut}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mut"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    restart: unless-stopped

  migrate:
    image: ${MUT_IMAGE:-clivern/mut:latest}
    restart: "no"
    command: ["migrate", "up", "-c", "/app/configs/config.yml"]
    environment:
      MUT_SERVER_URL: ${MUT_SERVER_URL:-http://localhost}
      MUT_DATABASE_HOST: postgres
      MUT_DATABASE_PORT: "5432"
      MUT_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      MUT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MUT_DATABASE_NAME: ${POSTGRES_DB:-mut}
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - mut_data:/app/var
    depends_on:
      postgres:
        condition: service_healthy

  mut:
    image: ${MUT_IMAGE:-clivern/mut:latest}
    restart: unless-stopped
    command: ["server", "-c", "/app/configs/config.yml"]
    environment:
      MUT_SERVER_URL: ${MUT_SERVER_URL:-http://localhost}
      MUT_DATABASE_HOST: postgres
      MUT_DATABASE_PORT: "5432"
      MUT_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      MUT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MUT_DATABASE_NAME: ${POSTGRES_DB:-mut}
      MUT_BROKER_URL: nats://nats:4222
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - mut_data:/app/var
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mut

volumes:
  postgres_data:
  mut_data:
